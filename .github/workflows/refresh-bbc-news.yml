name: Refresh BBC cricket news

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch BBC Sport cricket RSS
        run: python automation/fetch_bbc_news.py
      - name: Commit refreshed news
        run: |
          git config user.name "CricketNow News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/bbc-news.json
          git diff --cached --quiet || git commit -m "Refresh BBC cricket news"
          git push
